<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>发布中心 v{{version}}</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
         background: #eef1f6; color: #24292f; font-size: 14px; }
  header { background: linear-gradient(90deg, #16233a 0%, #24466e 60%, #2f6fce 100%);
           color: #fff; padding: 12px 22px; display: flex;
           align-items: center; justify-content: space-between;
           box-shadow: 0 2px 8px rgba(22,35,58,.25); }
  header h1 { font-size: 17px; margin: 0; font-weight: 600; letter-spacing: .5px; }
  header .ver { font-size: 12px; opacity: .75; margin-left: 10px; background: rgba(255,255,255,.14);
                padding: 2px 9px; border-radius: 10px; }
  .btn { cursor: pointer; border: none; border-radius: 6px; padding: 7px 14px;
         background: #2f7be4; color: #fff; font-size: 13px; transition: all .15s; }
  .btn:hover { background: #2565c4; box-shadow: 0 2px 6px rgba(47,123,228,.35); }
  .btn.gray { background: #e6e9f0; color: #454f5e; }
  .btn.gray:hover { background: #d7dce6; box-shadow: none; }
  .btn.danger { background: #e05252; }
  .btn.danger:hover { background: #c73e3e; box-shadow: 0 2px 6px rgba(224,82,82,.3); }
  .btn.small { padding: 4px 10px; font-size: 12px; border-radius: 5px; }
  .layout { display: flex; height: calc(100vh - 47px); }
  .left { width: 380px; border-right: 1px solid #e1e5ee; overflow-y: auto; padding: 14px; background: #f7f9fc; }
  .right { flex: 1; overflow-y: auto; padding: 16px 20px; }
  .card { border: 1px solid #e4e8f0; border-radius: 10px; padding: 12px 14px; margin-bottom: 12px;
          background: #fff; box-shadow: 0 1px 3px rgba(30,45,70,.06); transition: box-shadow .15s; }
  .card:hover { box-shadow: 0 3px 10px rgba(30,45,70,.12); }
  .card h3 { margin: 0 0 8px; font-size: 14px; }
  .muted { color: #7d8799; font-size: 12px; }
  .sec-title { font-weight: 600; margin: 18px 0 8px; color: #1d2b45; display: flex; align-items: center; }
  .sec-title::before { content: ''; width: 3px; height: 14px; background: #2f7be4;
                       border-radius: 2px; margin-right: 7px; }
  .tag { display: inline-block; padding: 2px 9px; border-radius: 10px; font-size: 12px; font-weight: 500; }
  .t-pending { background: #edf0f5; color: #5a6478; }
  .t-running { background: #fff5e0; color: #b8860b; }
  .t-success { background: #e4f6eb; color: #218a52; }
  .t-failed { background: #fdeaea; color: #c0392b; }
  .t-rolled_back { background: #fdeede; color: #c87f0a; }
  .t-canceled { background: #edf0f5; color: #8a94a6; }
  .chip { display: inline-block; padding: 1px 8px; border-radius: 4px; font-size: 12px;
          background: #eef3fb; color: #2b5ea7; margin: 1px 3px 1px 0; font-family: Consolas, monospace; }
  input, select, textarea { width: 100%; padding: 7px 9px; border: 1px solid #ccd4e0;
         border-radius: 6px; font-size: 13px; margin-bottom: 6px; font-family: inherit;
         background: #fff; transition: border-color .15s, box-shadow .15s; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: #2f7be4;
         box-shadow: 0 0 0 2px rgba(47,123,228,.15); }
  label { font-size: 12px; color: #55607a; display: block; margin: 6px 0 3px; }
  .step { border-left: 3px solid #d7dce6; padding: 8px 10px; margin: 7px 0; background: #fafbfd;
          border-radius: 0 8px 8px 0; }
  .step.success { border-color: #2e9e63; background: #f4fbf7; }
  .step.failed { border-color: #e05252; background: #fdf6f6; }
  .step.running { border-color: #e0a52e; background: #fffaf0; }
  .step .log { white-space: pre-wrap; font-family: Consolas, monospace; font-size: 12px;
               background: #1b2432; color: #cfe0f2; padding: 8px 10px; border-radius: 6px;
               max-height: 180px; overflow: auto; margin-top: 5px; }
  .modal { position: fixed; inset: 0; background: rgba(15,25,45,.45); display: none;
           align-items: center; justify-content: center; z-index: 50; }
  .modal.show { display: flex; }
  .modal .box { background: #fff; width: 540px; max-width: 94vw; border-radius: 12px;
                padding: 20px 22px; max-height: 88vh; overflow: auto;
                box-shadow: 0 12px 40px rgba(15,25,45,.3); }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  .login { max-width: 340px; margin: 12vh auto; }
  #order-detail { position: sticky; top: -16px; z-index: 5; margin-top: 16px; }

  /* --- 制品包上传：拖拽区 / 队列 / 进度 --- */
  .up-zone { border: 2px dashed #b9c6da; border-radius: 10px; padding: 16px 14px; text-align: center;
             background: #f8fbff; transition: all .15s; cursor: pointer; }
  .up-zone:hover { border-color: #7fa9e0; background: #f2f8ff; }
  .up-zone.over { border-color: #2f7be4; background: #e8f2ff; box-shadow: inset 0 0 0 1px #2f7be4; }
  .up-zone .big { font-size: 13px; color: #33415c; margin-bottom: 6px; }
  .up-opts { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 10px; }
  .up-opts label { margin: 0; display: inline-flex; align-items: center; gap: 4px; }
  .up-opts input[type=checkbox] { width: auto; margin: 0; }
  .up-bar { height: 8px; background: #e6ebf3; border-radius: 5px; overflow: hidden; margin: 10px 0 4px; }
  .up-bar > i { display: block; height: 100%; width: 0; background: linear-gradient(90deg,#2f7be4,#4aa3f0);
                transition: width .2s; }
  .up-list { max-height: 230px; overflow: auto; border: 1px solid #e4e8f0; border-radius: 8px; margin-top: 6px; }
  .up-item { display: flex; align-items: center; gap: 8px; padding: 5px 9px; font-size: 12px;
             border-bottom: 1px solid #f0f3f8; }
  .up-item:last-child { border-bottom: none; }
  .up-item .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .up-item .st { flex: 0 0 auto; font-size: 11px; }
  .up-item.ok .st { color: #218a52; }
  .up-item.fail .st { color: #c0392b; }
  .up-item.dup .st { color: #b8860b; }
  .up-item .sz { flex: 0 0 auto; color: #8a94a6; }
  /* --- 发布单：制品包多选 --- */
  .pkg-picker { max-height: 200px; overflow: auto; border: 1px solid #e4e8f0; border-radius: 8px; padding: 4px 8px; }
  .pkg-picker label { display: flex; align-items: center; gap: 7px; margin: 0; padding: 4px 0;
                      font-size: 13px; color: #24292f; cursor: pointer; }
  .pkg-picker label:hover { background: #f5f8fd; }
  .pkg-picker input[type=checkbox] { width: auto; margin: 0; flex: 0 0 auto; }
  .pkg-picker .meta { color: #8a94a6; font-size: 11px; }
  .picker-bar { display: flex; gap: 6px; align-items: center; margin-top: 6px; flex-wrap: wrap; }
  .picker-bar input[type=text] { margin: 0; flex: 1 1 140px; }

  /* --- 发布单：实时执行：总进度条 --- */
  .ord-bar { height: 8px; background: #e6ebf3; border-radius: 5px; overflow: hidden; margin: 10px 0 5px; }
  .ord-bar > div { height: 100%; width: 0; border-radius: 5px;
                   background: linear-gradient(90deg, #2f7be4, #4aa3f0); transition: width .25s ease; }
  #ord-prog-text { margin-bottom: 2px; }

  /* --- 发布单：步骤流水线 --- */
  .pipeline { margin: 4px 0 2px; }
  .pipeline .step { cursor: pointer; transition: box-shadow .15s, background .15s; }
  .pipeline .step:hover { box-shadow: 0 1px 4px rgba(30,45,70,.12); }
  .pipeline .step.active { box-shadow: inset 0 0 0 1px #2f7be4; }
  .pipeline .step .step-el { color: #8a94a6; font-size: 11px; margin-left: 6px; }
  .pipeline .step .step-msg { display: block; color: #6b7688; font-size: 12px; margin-top: 3px; }

  /* --- 发布单：脚本输出控制台 --- */
  .ord-console { margin-top: 12px; border: 1px solid #d7dce6; border-radius: 8px; overflow: hidden;
                 background: #fff; }
  .ord-console-h { display: flex; align-items: center; gap: 8px; padding: 6px 10px;
                   border-bottom: 1px solid #d7dce6; background: #f4f7fc; font-size: 13px; font-weight: 600;
                   color: #1d2b45; }
  .ord-console-h .muted { flex: 1; font-weight: 400; overflow: hidden; text-overflow: ellipsis;
                          white-space: nowrap; }
  .ord-console-h .btn.small { flex: 0 0 auto; }
  .ord-console-body { font-family: Consolas, "Courier New", monospace; font-size: 12px; line-height: 1.55;
                      white-space: pre-wrap; word-break: break-all; background: #1b2432; color: #cfe0f2;
                      padding: 9px 11px; height: 260px; overflow: auto; }
  .ord-console-body .muted { color: #7d8ba0; font-size: 12px; }
</style>
</head>
<body>
<header>
  <div><h1>发布中心<span class="ver">v{{version}}</span></h1></div>
  <div id="hdr-user" class="muted" style="color:#cfd8e3"></div>
</header>

<!-- 登录 -->
<div id="login" class="login card" style="display:none">
  <h3>登录发布中心</h3>
  <label>用户名</label><input id="lg-user" value="admin">
  <label>口令</label><input id="lg-pass" type="password">
  <button class="btn" onclick="doLogin()">登录</button>
  <div id="lg-msg" class="muted" style="margin-top:8px"></div>
</div>

<!-- 主界面 -->
<div id="main" class="layout" style="display:none">
  <div class="left">
    <div class="sec-title">应用定义</div>
    <div id="app-list"></div>
    <button class="btn small" onclick="showApp()">+ 新增应用</button>
    <div class="sec-title">制品包</div>
    <div id="pkg-list"></div>
    <button class="btn small gray" onclick="uploadPkg()">+ 上传制品包（拖拽 / 多选 / 整目录）</button>
    <div class="sec-title">目标服务器</div>
    <div id="srv-list"></div>
    <button class="btn small" onclick="showServer()">+ 新增服务器</button>
  </div>
  <div class="right">
    <div class="row" style="margin-bottom:8px">
      <button class="btn" onclick="loadOrders()">刷新发布单</button>
      <button class="btn" onclick="showOrder()">+ 创建发布单</button>
    </div>
    <div id="order-detail"></div>
    <div id="order-list"></div>
  </div>
</div>

<!-- 弹窗 -->
<div id="modal" class="modal"><div class="box" id="modal-box"></div></div>

<script>
var TOKEN = localStorage.getItem('rc_token') || '';
var STATE_ZH = { pending: '待执行', running: '执行中', success: '成功', failed: '失败',
                 rolled_back: '已回滚', canceled: '已取消' };

function authHeaders(extra) {
  var h = extra || {};
  if (TOKEN) h['X-Auth-Token'] = TOKEN;
  return h;
}
function api(method, url, body) {
  var opt = { method: method, headers: authHeaders() };
  if (body !== undefined) {
    opt.headers['Content-Type'] = 'application/json';
    opt.body = JSON.stringify(body);
  }
  return fetch(url, opt).then(function (r) {
    if (r.status === 401) { showLogin(); throw new Error('未登录'); }
    return r.json();
  });
}
function stateTag(s) {
  return '<span class="tag t-' + esc(s || 'pending') + '">' + esc(STATE_ZH[s] || s || '待执行') + '</span>';
}
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
  return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]; }); }
// 用于「双引号属性里、JS 单引号字符串中」的数据（如 onclick="editApp('…')"）：
// 先做 HTML 转义（& < > "），再做 JS 字符串转义（\ '）。只做 HTML 转义时，
// &#39; 会在属性解析阶段被还原成 '，从而逃出 JS 字符串造成注入。
function escJs(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;')
    .replace(/\\/g, '\\\\').replace(/'/g, "\\'");
}
function v(id) { var el = document.getElementById(id); return el ? el.value : ''; }

function showLogin() {
  TOKEN = ''; localStorage.removeItem('rc_token');
  document.getElementById('main').style.display = 'none';
  document.getElementById('login').style.display = 'block';
}
function doLogin() {
  fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username: v('lg-user'), password: v('lg-pass') }) })
    .then(function (r) { return r.json(); }).then(function (d) {
      if (d.status === 'success') {
        TOKEN = d.token; localStorage.setItem('rc_token', TOKEN);
        document.getElementById('login').style.display = 'none';
        boot();
      } else document.getElementById('lg-msg').textContent = d.message || '登录失败';
    });
}
function logout() {
  api('POST', '/api/logout').then(function () { showLogin(); });
}
function me() {
  return fetch('/api/me', { headers: authHeaders() }).then(function (r) { return r.json(); });
}

/* ---------------- 左侧：应用 / 制品包 / 服务器 ---------------- */
function loadApps() {
  api('GET', '/api/apps').then(function (d) {
    var h = '';
    (d.apps || []).forEach(function (a) {
      var stepsInfo = (a.steps && a.steps.length)
        ? ('自定义步骤链: ' + a.steps.length + ' 步（' + a.steps.map(function (s) { return esc(s.name); }).join('→') + '）')
        : '默认六步链';
      var pdefs = a.param_defs || [];
      var paramInfo = pdefs.length
        ? ('发布参数: ' + pdefs.map(function (p) {
            return '<span class="chip">' + esc(p.key) + (p.required ? '*' : '') + '</span>'; }).join(''))
        : '发布参数: 无';
      var varNames = Object.keys(a.vars || {});
      h += '<div class="card"><b>' + esc(a.name) + '</b> <span class="muted">' + esc(a.biz) + '</span>'
        + '<div class="muted">目标: ' + esc(a.target_dir) + '<br>包名: ' + esc(a.package)
        + '<br>' + stepsInfo
        + '<br>' + paramInfo
        + (varNames.length ? '<br>变量: ' + varNames.map(function (k) { return '<span class="chip">' + esc(k) + '</span>'; }).join('') : '')
        + '<br>备份保留: ' + a.backup_keep + ' 份 · 健康: ' + esc(a.health_type) + '</div>'
        + '<div class="row" style="margin-top:6px">'
        + '<button class="btn small gray" onclick="editApp(\'' + escJs(a.name) + '\')">编辑</button>'
        + '<button class="btn small danger" onclick="delApp(\'' + escJs(a.name) + '\')">删除</button></div></div>';
    });
    if (!d.apps || !d.apps.length) h = '<div class="muted">暂无应用</div>';
    document.getElementById('app-list').innerHTML = h;
  });
}
function loadPkgs() {
  api('GET', '/api/packages').then(function (d) {
    var h = '';
    (d.packages || []).forEach(function (p) {
      h += '<div class="card"><b>' + esc(p.name) + '</b> <span class="muted">' + esc(p.app) + ' ' + esc(p.version) + '</span>'
        + '<div class="muted">大小: ' + esc(fmtSize(p.size)) + ' · MD5: ' + esc((p.md5 || '').slice(0, 12)) + '…'
        + (p.src ? '<br>来源: ' + esc(p.src) : '') + '</div>'
        + '<button class="btn small danger" onclick="delPkg(\'' + escJs(p.name) + '\')">删除</button></div>';
    });
    if (!d.packages || !d.packages.length) h = '<div class="muted">暂无制品包</div>';
    document.getElementById('pkg-list').innerHTML = h;
  });
}
function loadServers() {
  api('GET', '/api/servers').then(function (d) {
    var h = '';
    (d.servers || []).forEach(function (s) {
      h += '<div class="card"><b>' + esc(s.name) + '</b> <span class="muted">' + esc(s.host) + '</span>'
        + '<div class="muted">上传:' + s.upload_port + ' · 命令:' + s.shell_port + ' · 目录:' + esc(s.upload_dir) + '</div>'
        + '<div class="row"><button class="btn small gray" onclick="editServer(\'' + escJs(s.name) + '\')">编辑</button>'
        + '<button class="btn small danger" onclick="delServer(\'' + escJs(s.name) + '\')">删除</button></div></div>';
    });
    if (!d.servers || !d.servers.length) h = '<div class="muted">暂无服务器</div>';
    document.getElementById('srv-list').innerHTML = h;
  });
}

/* ---------------- 右侧：发布单 ---------------- */
function orderPkgs(o) {
  var list = (o && o.packages && o.packages.length) ? o.packages : (o && o.package ? [o.package] : []);
  return list;
}
function pkgChips(o) {
  return orderPkgs(o).map(function (n) { return '<span class="chip">' + esc(n) + '</span>'; }).join('');
}

function loadOrders() {
  api('GET', '/api/orders?limit=50').then(function (d) {
    var h = '<div class="sec-title">发布单列表</div>';
    (d.orders || []).forEach(function (o) {
      var n = orderPkgs(o).length;
      h += '<div class="card" style="cursor:pointer" onclick="showOrderDetail(\'' + escJs(o.id) + '\')">'
        + '<b>' + esc(o.app) + '</b> ' + stateTag(o.state) + ' <span class="muted">' + esc(o.version)
        + ' · 包 ' + n + ' 个 · ' + (o.servers || []).join(',') + ' · ' + (o.strategy === 'parallel' ? '并行' : '串行')
        + ' · ' + esc(o.user || '') + '</span>'
        + '<div style="margin-top:4px">' + pkgChips(o) + '</div></div>';
    });
    if (!d.orders || !d.orders.length) h += '<div class="muted">暂无发布单</div>';
    document.getElementById('order-list').innerHTML = h;
  });
}

/* ---------------- 发布单：实时进度 + 脚本输出控制台 ----------------
   两件事：
     ① 执行到哪一步  —— 步骤状态/耗时/进度条/当前步骤高亮
     ② 脚本返回信息  —— 按步骤实时追加 stdout/stderr（执行过的可回看）
   数据来源：/api/orders/<id>/stream（SSE）snapshot / start / step / log / done。
   另一份等价实现在平台页 platform_console/static/app.js，改动请同步。
------------------------------------------------------------------ */
var STREAM = null, CUR_ORDER = null, OM = null, O_FOLLOW = null, O_FOLLOW_ON = true;
var O_RENDERED = null, O_RECONNECT = null;
var O_LIMIT = 200000;
var STEP_ZH = { pending: '待执行', running: '执行中', success: '成功', failed: '失败',
  canceled: '已取消', skipped: '已跳过', rolled_back: '已回滚' };

function oKey(server, name) { return (server || '') + '|' + (name || ''); }
function oStepZh(s) { return STEP_ZH[s] || s || '待执行'; }

function stopStream() { if (STREAM) { try { STREAM.close(); } catch (e) {} STREAM = null; } }

function showOrderDetail(id) {
  stopStream();
  CUR_ORDER = id; OM = null; O_FOLLOW = null; O_RENDERED = null; O_FOLLOW_ON = true;
  openStream(id);          /* 先订阅：执行中的事件一个都不漏 */
  refreshDetail();         /* 再取一份快照（流里也会推一份，谁先到都能画） */
}

function refreshDetail() {
  if (!CUR_ORDER) return;
  api('GET', '/api/orders/' + encodeURIComponent(CUR_ORDER)).then(function (d) {
    if (d && d.order) setSnapshot(d.order);
    else if (d && d.id) setSnapshot(d);
  });
}

function openStream(id) {
  try {
    STREAM = new EventSource('/api/orders/' + encodeURIComponent(id)
      + '/stream?token=' + encodeURIComponent(TOKEN));
  } catch (e) { return; }
  var ondata = function (ev) {
    var m; try { m = JSON.parse(ev.data); } catch (x) { return; }
    applyEvent(m && m.type ? m : ((m && m.data && m.data.type) ? m.data : (m && m.data) || {}));
  };
  STREAM.onmessage = ondata;                                  /* 直连：默认 message */
  STREAM.addEventListener('release', ondata);                 /* 经平台透传时被命名 */
  STREAM.addEventListener('close', function () { stopStream(); });
  STREAM.onerror = function () {
    if (O_RECONNECT) return;
    O_RECONNECT = setTimeout(function () {
      O_RECONNECT = null; if (CUR_ORDER === id) refreshDetail();
    }, 1500);
  };
}

/* ---------- 模型 ---------- */
function setSnapshot(o) {
  if (!o) return;
  OM = { order: o, logs: {}, percent: null, cleared: null };
  (o.server_steps || []).forEach(function (run) {
    (run.steps || []).forEach(function (st) {
      OM.logs[oKey(run.server, st.name)] = (st.logs || []).join('\n');
    });
  });
  autoFollow();
  paint();
}

function autoFollow() {
  if (!OM || !O_FOLLOW_ON) return;
  var running = null, last = null;
  (OM.order.server_steps || []).forEach(function (r) {
    (r.steps || []).forEach(function (st) {
      var k = oKey(r.server, st.name);
      if (st.logs && st.logs.length) last = k;
      if (st.state === 'running') running = k;
    });
  });
  O_FOLLOW = running || last || O_FOLLOW;
}

function appendLog(key, text) {
  if (!OM || !text) return;
  OM.logs[key] = (OM.logs[key] || '') + text;
}

function progress() {
  var o = OM && OM.order;
  if (!o) return { pct: 0, total: 0, running: null };
  var done = 0, total = 0, running = null;
  (o.server_steps || []).forEach(function (r) {
    (r.steps || []).forEach(function (st, i) {
      total++;
      if (st.state === 'success' || st.state === 'failed') done++;
      if (st.state === 'running') {
        running = { server: r.server, label: st.label || st.name,
          index: i + 1, total: (r.steps || []).length };
      }
    });
  });
  var fin = ['success', 'failed', 'rolled_back', 'canceled'].indexOf(o.state || '') >= 0;
  var pct = (OM.percent != null) ? OM.percent : (total ? Math.round(done * 100 / total) : 0);
  if (fin) pct = 100;
  return { pct: pct, total: total, running: running };
}

  }

    body.innerHTML = '<div class="muted">' + (text ? '（已清空，后续输出继续显示）' : '该步骤暂无输出') + '</div>';

function appendConsole(text) {
  var body = document.getElementById('ord-console-body'); if (!body || !text) return;
  var atBottom = consoleAtBottom(body);
  if (body.querySelector('.muted')) body.textContent = '';
  body.textContent += text;
  if (body.textContent.length > O_LIMIT * 1.5) {
    body.textContent = '（已截断较早输出）\n' + body.textContent.slice(-O_LIMIT);
  }

function consoleAtBottom(body) {
  try { return (body.scrollHeight - body.scrollTop - body.clientHeight) < 24; } catch (e) { return true; }
}

}

/* ---------- 事件 ---------- */
function applyEvent(ev) {
  if (!ev || (ev.order_id && ev.order_id !== CUR_ORDER)) return;
  var t = ev.type;
  if (t === 'snapshot') { setSnapshot(ev.order); return; }
  if (t === 'log') {
    var key = oKey(ev.server, ev.step);
    appendLog(key, ev.text || '');
    if (O_FOLLOW_ON && O_FOLLOW !== key) { O_FOLLOW = key; renderConsole(); updateConsoleHead(); }
    else if (O_FOLLOW === key) appendConsole(ev.text || '');
    return;
  }
  if (t === 'start' || t === 'rollback_start') {
    if (OM) { OM.order.state = 'running'; OM.percent = 0; }
    paint(); return;
  }
  if (t === 'done') {
    if (OM) { OM.order.state = ev.state || OM.order.state; OM.percent = 100; }
    paint(); stopStream(); loadOrders(); return;
  }
  if (t === 'step') {
    var o = OM && OM.order; if (!o) return;
    (o.server_steps || []).forEach(function (run) {
      if (run.server !== ev.server) return;
      (run.steps || []).forEach(function (st) {
        if (st.name !== ev.step) return;
        st.state = ev.state || st.state;
        if (ev.message) st.message = ev.message;
        if (ev.elapsed) st.elapsed = ev.elapsed;
        if (ev.label) st.label = ev.label;
      });
    });
    if (typeof ev.percent === 'number') OM.percent = ev.percent;
    if (ev.state === 'running' && O_FOLLOW_ON) O_FOLLOW = oKey(ev.server, ev.step);
    paint(); return;
  }
  paint();
}

document.addEventListener('click', function (e) {
  var t = e.target, node = null;
  while (t && t !== document) {
    if (t.getAttribute && t.getAttribute('data-step-key')) { node = t; break; }
    t = t.parentNode;
  }
  if (node) followStep(node.getAttribute('data-step-key'));
});

    + '  <label class="muted">并发数 <select id="u-conc" style="width:70px;margin:0">'
    + '     <option value="1">1</option><option value="2" selected>2</option>'
    + '     <option value="3">3</option><option value="4">4</option></select></label>'
    + '</div>'
    + '<div class="up-bar"><i id="u-bar"></i></div>'
    + '<div class="muted" id="u-sum">尚未选择文件</div>'
    + '<div class="up-list" id="u-list"></div>'
    + '<div class="row" style="margin-top:10px">'
    + '  <button class="btn" id="u-go" onclick="startUpload()">开始上传</button>'
    + '  <button class="btn gray" id="u-stop" onclick="cancelUpload()" style="display:none">停止</button>'
    + '  <button class="btn gray" onclick="closeModal()">关闭</button>'
    + '</div>');
  var fi = document.getElementById('u-files');
  var di = document.getElementById('u-dir');
  fi.onchange = function () { addUploadFiles(this.files); this.value = ''; };
  di.onchange = function () { addUploadFiles(this.files); this.value = ''; };
  var zone = document.getElementById('u-zone');
  zone.onclick = function (e) {
    if (e.target.tagName === 'BUTTON') return;
    document.getElementById('u-files').click();
  };
  bindDrop(zone);
  renderQueue();
}

/* 拖拽：既支持拖文件，也支持拖文件夹（webkitGetAsEntry 递归展开） */
function bindDrop(zone) {
  ['dragenter', 'dragover'].forEach(function (ev) {
    zone.addEventListener(ev, function (e) { e.preventDefault(); e.stopPropagation(); zone.classList.add('over'); });
  });
  ['dragleave', 'dragend'].forEach(function (ev) {
    zone.addEventListener(ev, function (e) { e.preventDefault(); e.stopPropagation(); zone.classList.remove('over'); });
  });
  zone.addEventListener('drop', function (e) {
    e.preventDefault(); e.stopPropagation(); zone.classList.remove('over');
    var dt = e.dataTransfer;
    if (!dt) return;
    var entries = [];
    if (dt.items && dt.items.length && dt.items[0].webkitGetAsEntry) {
      for (var i = 0; i < dt.items.length; i++) {
        var it = dt.items[i];
        if (it.kind !== 'file') continue;
        var en = it.webkitGetAsEntry();
        if (en) entries.push(en);
      }
    }
    if (entries.length) {
      zone.querySelector('.big').innerHTML = '正在读取文件夹…';
      Promise.all(entries.map(function (en) { return readEntry(en, '', []); })).then(function (arrs) {
        var out = [];
        arrs.forEach(function (a) { out = out.concat(a); });
        addUploadFiles(out, true);
        renderQueue();
      });
    } else if (dt.files && dt.files.length) {
      addUploadFiles(dt.files);
    }
  });
}
function readEntry(entry, prefix, out) {
  return new Promise(function (res) {
    if (entry.isFile) {
      entry.file(function (f) { out.push({ file: f, src: prefix + f.name }); res(); },
                 function () { res(); });
    } else if (entry.isDirectory) {
      var reader = entry.createReader();
      var kids = [];
      var pump = function () {
        reader.readEntries(function (ents) {
          if (!ents.length) {
            var sub = entry.name + '/';
            Promise.all(kids.map(function (k) { return readEntry(k, prefix + sub, out); }))
              .then(function () { res(); });
            return;
          }
          kids = kids.concat(Array.prototype.slice.call(ents));
          pump();   // readEntries 每次最多返回 100 项，需要循环读完
        }, function () { res(); });
      };
      pump();
    } else { res(); }
  });
}

function addUploadFiles(list, isObj) {
  if (!list || !list.length) return;
  var msg = document.getElementById('u-sum');
  var seen = {};
  UP_QUEUE.forEach(function (q) { seen[q.src] = true; });
  var dupInQueue = 0, skippedDir = 0;
  for (var i = 0; i < list.length; i++) {
    var item = list[i];
    var f, src;
    if (isObj) { f = item.file; src = item.src || f.name; }
    else {
      f = item;
      // webkitRelativePath 来自「选择目录」，能带上子目录层级，用于溯源展示
      src = f.webkitRelativePath || f.name;
    }
    if (!f || !f.name) continue;
    if (f.name === '.DS_Store' || f.name === 'Thumbs.db' || f.name === 'desktop.ini') { skippedDir++; continue; }
    if (seen[src]) { dupInQueue++; continue; }
    seen[src] = true;
    UP_QUEUE.push({ file: f, src: src, name: f.name, size: f.size || 0,
                    state: 'wait', pct: 0, msg: '', dup: false });
  }
  if (msg) {
    var tips = [];
    if (dupInQueue) tips.push('队列内重复 ' + dupInQueue + ' 个');
    if (skippedDir) tips.push('忽略系统文件 ' + skippedDir + ' 个');
    renderQueue(tips.length ? '（' + tips.join('，') + '）' : '');
  } else {
    renderQueue();
  }
}

function renderQueue(tip) {
  var box = document.getElementById('u-list');
  var sum = document.getElementById('u-sum');
  if (!box) return;
  var h = '';
  var done = 0, okN = 0, failN = 0, dupN = 0, upN = 0;
  UP_QUEUE.forEach(function (q, i) {
    var cls = q.state === 'ok' ? 'ok' : (q.state === 'fail' ? 'fail' : (q.dup ? 'dup' : ''));
    var st = { wait: '等待', up: (q.pct + '%'), ok: '完成', fail: '失败', dup: '已存在(跳过)' }[q.state] || q.state;
    h += '<div class="up-item ' + cls + '"><span class="nm" title="' + esc(q.src) + '">'
      + (i + 1) + '. ' + esc(q.src) + (q.msg ? ' <span class="muted">(' + esc(q.msg) + ')</span>' : '')
      + '</span><span class="sz">' + esc(fmtSize(q.size)) + '</span><span class="st">' + esc(st) + '</span></div>';
    if (q.state === 'ok') { done++; okN++; }
    else if (q.state === 'dup') { done++; dupN++; }
    else if (q.state === 'fail') { done++; failN++; }
    else if (q.state === 'up') upN++;
  });
  box.innerHTML = h || '<div class="up-item muted">（队列为空）</div>';
  var pct = UP_QUEUE.length ? Math.round(done * 100 / UP_QUEUE.length) : 0;
  var bar = document.getElementById('u-bar');
  if (bar) bar.style.width = pct + '%';
  if (sum) {
    sum.textContent = UP_QUEUE.length
      ? ('共 ' + UP_QUEUE.length + ' 个文件 · 完成 ' + done + '（新增 ' + okN
         + '，跳过重复 ' + dupN + '，失败 ' + failN + '）· 上传中 ' + upN + (tip || ''))
      : ('尚未选择文件' + (tip || ''));
  }
  var go = document.getElementById('u-go');
  if (go) {
    go.textContent = (done < UP_QUEUE.length && UP_RUNNING) ? '上传中…' : (done >= UP_QUEUE.length && UP_QUEUE.length ? '全部完成' : '开始上传');
    go.disabled = UP_RUNNING || !UP_QUEUE.length || done >= UP_QUEUE.length;
  }
  var stop = document.getElementById('u-stop');
  if (stop) stop.style.display = UP_RUNNING ? '' : 'none';
}

function startUpload() {
  if (UP_RUNNING) return;
  var todo = UP_QUEUE.filter(function (q) { return q.state === 'wait'; });
  if (!todo.length) { alert('没有待上传的文件'); return; }
  var c = parseInt((document.getElementById('u-conc') || {}).value || '2', 10);
  UP_CONCURRENCY = Math.max(1, Math.min(8, c || 2));
  UP_RUNNING = true; UP_CANCEL = false; UP_XHRS = [];
  var idx = 0;
  var pump = function () {
    if (UP_CANCEL || idx >= todo.length) return Promise.resolve();
    var item = todo[idx++];
    return upOne(item).then(pump);
  };
  var workers = [];
  for (var i = 0; i < UP_CONCURRENCY; i++) workers.push(pump());
  Promise.all(workers).then(function () {
    UP_RUNNING = false;
    renderQueue();
    loadPkgs();
    var failed = UP_QUEUE.filter(function (q) { return q.state === 'fail'; }).length;
    if (!failed) setTimeout(function () {
      var main = document.getElementById('main');
      if (main && main.style.display !== 'none') closeModal();
    }, 600);
  });
}

function upOne(item) {
  return new Promise(function (resolve) {
    if (UP_CANCEL) { resolve(); return; }
    item.state = 'up'; item.pct = 0; renderQueue();
    var skip = document.getElementById('u-skipdup');
    var qs = '/api/packages/upload?filename=' + encodeURIComponent(item.name)
      + '&app=' + encodeURIComponent(v('u-app')) + '&version=' + encodeURIComponent(v('u-ver'))
      + '&src=' + encodeURIComponent(item.src) + '&skip_dup=' + (skip && skip.checked ? 1 : 0);
    var xhr = new XMLHttpRequest();
    UP_XHRS.push(xhr);
    xhr.open('POST', qs, true);
    if (TOKEN) xhr.setRequestHeader('X-Auth-Token', TOKEN);
    xhr.upload.onprogress = function (e) {
      if (e.lengthComputable) { item.pct = Math.round(e.loaded * 100 / e.total); renderQueue(); }
    };
    xhr.onload = function () {
      if (xhr.status === 401) { showLogin(); item.state = 'fail'; item.msg = '未登录'; resolve(); return; }
      var d = {};
      try { d = JSON.parse(xhr.responseText || '{}'); } catch (x) {}
      if (xhr.status === 200 && d.status === 'success') {
        if (d.duplicate) { item.state = 'dup'; item.dup = true; item.msg = '已有 ' + (d.name || ''); }
        else { item.state = 'ok'; item.pct = 100; }
      } else {
        item.state = 'fail'; item.msg = (d.message || ('HTTP ' + xhr.status));
      }
      renderQueue();
      resolve();
    };
    xhr.onerror = function () { item.state = 'fail'; item.msg = '网络错误'; renderQueue(); resolve(); };
    xhr.onabort = function () { if (item.state === 'up') item.state = 'wait'; renderQueue(); resolve(); };
    xhr.send(item.file);
  });
}

function cancelUpload() {
  UP_CANCEL = true;
  UP_XHRS.forEach(function (x) { try { x.abort(); } catch (e) {} });
  UP_XHRS = [];
  UP_RUNNING = false;
  UP_QUEUE.forEach(function (q) { if (q.state === 'up') q.state = 'wait'; });
  renderQueue();
}

var EDIT_SERVER = null;
function serverForm(s) {
  s = s || {};
  modal('<h3>' + (s.name ? '编辑服务器 ' + esc(s.name) : '新增服务器') + '</h3>'
    + '<label>名称</label><input id="s-name" ' + (s.name ? 'disabled value="' + esc(s.name) + '"' : '') + '>'
    + '<label>主机 host</label><input id="s-host" value="' + esc(s.host || '127.0.0.1') + '">'
    + '<label>上传端口 / 命令端口</label><div class="row"><input id="s-up" value="' + (s.upload_port || 8080) + '"><input id="s-sp" value="' + (s.shell_port || 9100) + '"></div>'
    + '<label>上传令牌 / 命令令牌</label><div class="row"><input id="s-ut" value="' + esc(s.upload_token || '') + '"><input id="s-st" value="' + esc(s.shell_token || '') + '"></div>'
    + '<label>远端上传目录 upload_dir</label><input id="s-ud" value="' + esc(s.upload_dir || '/opt/upload') + '">'
    + '<div class="row" style="margin-top:8px"><button class="btn" onclick="saveServer(\'' + escJs(s.name || '') + '\')">保存</button>'
    + '<button class="btn gray" onclick="closeModal()">取消</button></div>');
}
function showServer() { serverForm(null); }
function editServer(name) {
  api('GET', '/api/servers').then(function (d) {
    var s = (d.servers || []).filter(function (x) { return x.name === name; })[0];
    if (s) serverForm(s);
  });
}
function saveServer(origName) {
  var body = { name: v('s-name'), host: v('s-host'), upload_port: parseInt(v('s-up') || '8080', 10),
    shell_port: parseInt(v('s-sp') || '9100', 10), upload_token: v('s-ut'), shell_token: v('s-st'),
    upload_dir: v('s-ud') };
  var p;
  if (origName) p = api('PUT', '/api/servers/' + encodeURIComponent(origName), body);
  else p = api('POST', '/api/servers', body);
  p.then(function (d) { if (d.status === 'success') { closeModal(); loadServers(); } else alert(d.message); });
}

var ORDER_APPS = [];
var ORDER_PKGS = [];
var PKG_CHECKED = {};
var PKG_BY_APP = true;      // 制品包列表默认只显示「属于所选应用」的包

function renderOrderParams() {
  var box = document.getElementById('o-params');
  if (!box) return;
  var sel = v('o-app');
  var a = ORDER_APPS.filter(function (x) { return x.name === sel; })[0];
  var defs = (a && a.param_defs) || [];
  if (!defs.length) {
    box.innerHTML = '<div class="muted">该应用未定义发布参数（可在应用编辑里添加 param_defs）</div>';
    return;
  }
  var h = '';
  defs.forEach(function (p) {
    h += '<label>' + esc(p.label || p.key) + '（${' + esc(p.key) + '}）'
      + (p.required ? ' <span style="color:#c0392b">*</span>' : '') + '</label>'
      + '<input id="o-pm-' + esc(p.key) + '" value="' + esc(p.default || '') + '" '
      + 'placeholder="' + (p.required ? '必填' : '可留空，用应用默认') + '">';
  });
  box.innerHTML = h;
}

/* 制品包多选：可挂多个包一起发布（主程序包 + 配置包 / 版本包 + 补丁包） */
function visiblePkgs() {
  var sel = v('o-app');
  var q = ((document.getElementById('o-pkg-q') || {}).value || '').trim().toLowerCase();
  return ORDER_PKGS.filter(function (p) {
    if (PKG_BY_APP && sel && p.app && p.app !== sel) return false;
    if (q && String(p.name).toLowerCase().indexOf(q) < 0
        && String(p.app || '').toLowerCase().indexOf(q) < 0
        && String(p.src || '').toLowerCase().indexOf(q) < 0) return false;
    return true;
  });
}
function renderPkgPicker() {
  var box = document.getElementById('o-pkg');
  if (!box) return;
  var items = visiblePkgs();
  var h = '';
  items.forEach(function (p) {
    h += '<label><input type="checkbox" value="' + esc(p.name) + '"'
      + (PKG_CHECKED[p.name] ? ' checked' : '')
      + ' onchange="PKG_CHECKED[this.value]=this.checked;updatePkgSum()"> '
      + '<span>' + esc(p.name) + '</span>'
      + '<span class="meta">' + esc(p.app || '') + ' ' + esc(p.version || '') + ' · ' + esc(fmtSize(p.size)) + '</span></label>';
  });
  box.innerHTML = h || ('<div class="up-item muted">' + (ORDER_PKGS.length ? '没有匹配的制品包' : '暂无制品包，请先在左侧上传') + '</div>');
  updatePkgSum();
}
function updatePkgSum() {
  var el = document.getElementById('o-pkg-sum');
  if (!el) return;
  var names = pickedPkgs();
  el.innerHTML = names.length
    ? ('已选 <b>' + names.length + '</b> 个：' + names.map(function (n) { return '<span class="chip">' + esc(n) + '</span>'; }).join(''))
    : '<span class="muted">尚未选择制品包</span>';
}
function pickedPkgs() {
  return ORDER_PKGS.filter(function (p) { return PKG_CHECKED[p.name]; })
    .map(function (p) { return p.name; });
}
function pkgCheckAll(val) {
  visiblePkgs().forEach(function (p) { PKG_CHECKED[p.name] = val; });
  renderPkgPicker();
}
function onOrderAppChange() {
  renderOrderParams();
  var sel = v('o-app');
  // 切应用时把「该应用自己的包」自动勾上，减少手工挑选；用户取消勾选不会被覆盖
  var mine = ORDER_PKGS.filter(function (p) { return p.app && p.app === sel; });
  if (PKG_BY_APP && mine.length) {
    var anyChecked = pickedPkgs().length > 0;
    if (!anyChecked) mine.forEach(function (p) { PKG_CHECKED[p.name] = true; });
  }
  renderPkgPicker();
}

function showOrder() {
  api('GET', '/api/apps').then(function (da) {
    api('GET', '/api/packages').then(function (dp) {
      api('GET', '/api/servers').then(function (ds) {
        ORDER_APPS = da.apps || [];
        ORDER_PKGS = dp.packages || [];
        PKG_CHECKED = {};
        var appOpts = ORDER_APPS.map(function (a) { return '<option>' + esc(a.name) + '</option>'; }).join('');
        var srv = (ds.servers || []).map(function (s) {
          return '<label style="display:inline-block;margin-right:10px"><input type="checkbox" style="width:auto" value="' + esc(s.name) + '"> ' + esc(s.name) + '</label>';
        }).join('');
        modal('<h3>创建发布单</h3><label>应用</label><select id="o-app" onchange="onOrderAppChange()">' + appOpts + '</select>'
          + '<label>版本</label><input id="o-ver">'
          + '<label>制品包（可多选，会按顺序全部推到目标机）</label>'
          + '<div class="picker-bar">'
          + '  <input type="text" id="o-pkg-q" placeholder="按名称 / 应用 / 来源筛选" oninput="renderPkgPicker()">'
          + '  <button class="btn small gray" type="button" onclick="pkgCheckAll(true)">全选</button>'
          + '  <button class="btn small gray" type="button" onclick="pkgCheckAll(false)">清空</button>'
          + '  <label style="margin:0;display:inline-flex;align-items:center;gap:4px"><input type="checkbox" id="o-only-app" checked '
          + 'style="width:auto;margin:0" onchange="PKG_BY_APP=this.checked;renderPkgPicker()"> 只看所选应用</label>'
          + '</div>'
          + '<div class="pkg-picker" id="o-pkg"></div>'
          + '<div class="muted" id="o-pkg-sum" style="margin-top:6px"></div>'
          + '<label>策略</label><select id="o-st"><option value="serial">串行（逐台）</option><option value="parallel">并行（同时）</option></select>'
          + '<label>目标服务器（可多选）</label><div id="o-srv">' + (srv || '<span class="muted">暂无服务器</span>') + '</div>'
          + '<label style="margin-top:8px">发布参数（本次发布的取值，会注入所有步骤命令的 ${key}）</label><div id="o-params"></div>'
          + '<div class="row" style="margin-top:8px"><button class="btn" onclick="saveOrder()">创建</button>'
          + '<button class="btn gray" onclick="closeModal()">取消</button></div>');
        PKG_BY_APP = true;
        onOrderAppChange();
      });
    });
  });
}
function saveOrder() {
  var sv = []; document.querySelectorAll('#o-srv input:checked').forEach(function (c) { sv.push(c.value); });
  var sel = v('o-app');
  var a = ORDER_APPS.filter(function (x) { return x.name === sel; })[0];
  var params = {};
  var missing = [];
  ((a && a.param_defs) || []).forEach(function (p) {
    var val = (v('o-pm-' + p.key) || '').trim();
    if (p.required && !val) missing.push(p.label || p.key);
    params[p.key] = val;
  });
  if (missing.length) { alert('必填参数未填写: ' + missing.join(', ')); return; }
  var pkgs = pickedPkgs();
  if (!pkgs.length) { alert('请至少选择一个制品包'); return; }
  if (!sv.length) { alert('请至少选择一个目标服务器'); return; }
  var body = { app: sel, version: v('o-ver'), package: pkgs[0], packages: pkgs,
               strategy: v('o-st'), servers: sv, params: params };
  api('POST', '/api/orders', body).then(function (d) {
    if (d.status === 'success') { closeModal(); loadOrders(); showOrderDetail(d.id); } else alert(d.message);
  });
}

/* ---------------- 启动 ---------------- */
function boot() {
  me().then(function (d) {
    if (d.need_login) { showLogin(); return; }
    document.getElementById('login').style.display = 'none';
    document.getElementById('main').style.display = 'flex';
    var hdr = document.getElementById('hdr-user');
    hdr.textContent = (d.username || '') + ' / ' + (d.role_label || d.role || '');
    var btn = document.createElement('button');
    btn.className = 'btn small gray'; btn.textContent = '退出'; btn.style.marginLeft = '8px';
    btn.onclick = logout; hdr.appendChild(btn);
    loadApps(); loadPkgs(); loadServers(); loadOrders();
  });
}
boot();
</script>
